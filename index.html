<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#272320"><meta name="description" content="Личная свадебная история Михаила и Ксении. Фотографии, воспоминания и письма в будущее.">
<title>Михаил и Ксения — наша история</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23f4eee4'/%3E%3Cpath d='M20 31C-1 16 12 5 20 15C28 5 41 16 20 31Z' fill='none' stroke='%23905055' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="reader.css">
<script defer src="content.js"></script><script defer src="pen-marks.js"></script><script defer src="paint.js"></script><script defer src="engine.js"></script><script defer src="reader.js"></script><script defer src="counter.js"></script><script defer src="app.js"></script>
</head>
<body>
<div class="table-grain" aria-hidden="true"></div>
<header id="book-header"><button class="brand" id="home" aria-label="На обложку">Для вас, с любовью</button><button id="view-mode" aria-label="Включить мобильную версию" aria-pressed="false">Мобильная версия</button></header>
<main id="stage" aria-label="Свадебная книга">
<canvas id="book" aria-label="Интерактивная свадебная книга"></canvas><div id="hotspots"></div>
<div id="mobile-book"></div>
<div class="loading" id="loading" role="status">Собираем вашу историю<span>…</span></div>
</main>
<footer id="dock"><button id="prev" aria-label="Предыдущий разворот">← <span>Назад</span></button><button id="next" aria-label="Открыть книгу"><span>Открыть</span> →</button></footer>
<section class="sr-only" id="accessible-copy" aria-label="Текст текущего разворота"></section>
<section id="object-layer" class="object-layer" role="dialog" aria-modal="true" aria-label="Воспоминание из книги" aria-hidden="true" hidden><button id="return-object" class="return-object">Вернуть в альбом ×</button><div id="object-stage" class="object-stage"></div><p id="object-hint" class="object-hint"></p></section>
